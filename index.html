
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Arena</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            margin: 0;
        }

        header {
            background: #263238;
            color: white;
            padding: 25px;
        }

        main {
            margin: 60px 20px;
        }

        h2 {
            color: #263238;
        }

        button {
            background: #2e7d32;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1b5e20;
        }

        footer {
            background: #263238;
            color: white;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>♟ Chess Arena ♟</h1>
        <p>Your world of strategy and smart moves!</p>
    </header>

    <main>
        <h2>Welcome to Chess Arena</h2>
        <p>Learn chess, improve your skills, and enjoy the game.</p>

        <button onclick="alert('Welcome to Chess Arena!')">
            Start Playing
        </button>
    </main>

    <footer>
        <p>&copy; 2026 Chess Arena | All Rights Reserved</p>
    </footer>

</body>
</html>
